[package]
name = "blackboxd"
description = "Userspace daemon that collects scheduler events and triggers dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blackbox-core = { path = "../core" }
anyhow = "1"
aya = "0.14.0"
aya-log = "0.3.0"
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.29", features = ["user", "resource", "poll", "signal", "socket"] }
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
