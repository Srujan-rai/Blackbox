# Example blackbox configuration

[history]
# Maximum number of events to keep in memory
max_events = 250000
# Maximum history window in seconds
max_seconds = 30

[pressure]
# How often to poll PSI (ms)
poll_interval_ms = 250
# CPU pressure trigger
cpu = { enabled = true, threshold_pct = 80.0, consecutive = 4 }
# Memory pressure trigger
memory = { enabled = true, threshold_pct = 20.0, consecutive = 4 }
# IO pressure trigger
io = { enabled = true, threshold_pct = 20.0, consecutive = 4 }
# OOM-kill trigger. Unlike PSI this is a discrete event, not a level, so there
# is no threshold or window: any advance of the kernel's `oom_kill` counter in
# /proc/vmstat fires a dump.
oom = { enabled = true }

[dump]
# Where to write dump files
dir = "/var/lib/blackbox/dumps"
# How many dumps to keep (None = unlimited)
keep_last = 10
# Include timestamp in filename
timestamped_names = true

[bpf]
# Path to the compiled BPF object. Leave unset to search, in order:
#   1. the BLACKBOX_BPF_OBJECT environment variable
#   2. /usr/local/lib/blackbox/blackbox-bpf.o
#   3. /usr/lib/blackbox/blackbox-bpf.o
#   4. ./blackbox-bpf.o
# A path set here that is missing is a startup error; a search that finds
# nothing is reported in `blackbox status` and the daemon runs without BPF
# collection (manual dumps and PSI triggers still work).
# object_path = "/usr/local/lib/blackbox/blackbox-bpf.o"
